version: 2

project_name: tmetric

builds:
  - binary: tmetric
    main: ./cmd/tmetric
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/othercodes/tmetric-cli/internal/cmd.version=v{{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: versioned
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Same archives without the version, so docs can link a stable
  # releases/latest/download/<name> URL.
  - id: unversioned
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: tmetric
    ids: [versioned]
    repository:
      owner: othercodes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/othercodes/tmetric-cli
    description: Unofficial CLI and TUI for TMetric time tracking
    # Pre-releases (v1.2.3-rc.1) do not update the tap.
    skip_upload: auto
    # The binaries are not notarized; clear the quarantine attribute so
    # Gatekeeper does not block them.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tmetric"]
          end

release:
  # v1.2.3-rc.1 is published as a pre-release, like pyssertive does.
  prerelease: auto
  name_template: "Release {{ .Version }}"

changelog:
  use: github-native
