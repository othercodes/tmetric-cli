version: 2

project_name: tmetric

builds:
  - binary: tmetric
    main: ./cmd/tmetric
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/othercodes/tmetric-cli/internal/cmd.version=v{{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: versioned
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Same archives without the version, so docs can link a stable
  # releases/latest/download/<name> URL.
  - id: unversioned
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # v1.2.3-rc.1 is published as a pre-release, like pyssertive does.
  prerelease: auto
  name_template: "Release {{ .Version }}"

changelog:
  use: github-native
