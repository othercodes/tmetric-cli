sonar.projectKey=othercodes_tmetric-cli
sonar.organization=usantisteban

sonar.projectName=tmetric-cli

# Source code location: Go keeps tests next to the code they test. The scanner
# warns these have no effect, but without them *_test.go counts as uncovered code.
sonar.sources=.
sonar.exclusions=**/*_test.go,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go-specific settings
sonar.go.coverage.reportPaths=coverage.out
# cmd/tmetric/main.go only wires signals to os.Exit; the CI coverage gate drops it too
sonar.coverage.exclusions=cmd/tmetric/main.go

# Fail the scan (and so CI Success) when the quality gate is red
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8
