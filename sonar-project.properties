sonar.projectKey=othercodes_tmetric-cli
sonar.organization=usantisteban

sonar.projectName=tmetric-cli

# Source code location: Go keeps tests next to the code they test
sonar.sources=.
sonar.exclusions=**/*_test.go,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go-specific settings
sonar.go.coverage.reportPaths=coverage.out
# main.go only wires signals to os.Exit; the CI coverage gate drops it too
sonar.coverage.exclusions=main.go

# Encoding
sonar.sourceEncoding=UTF-8
